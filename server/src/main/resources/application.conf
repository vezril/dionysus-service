# dionysus runtime configuration. Every operational value is overridable by an
# environment variable via a Typesafe Config ${?ENV_VAR} substitution. No secrets
# are committed here.

dionysus {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }
  database {
    # /data is a dedicated, writable Docker VOLUME (build.sbt) — the app's
    # own WORKDIR (/opt/docker) is read-only for the non-root runtime user.
    sqlite-path = "/data/dionysus.db"
    sqlite-path = ${?DIONYSUS_DB_PATH}
  }
}
