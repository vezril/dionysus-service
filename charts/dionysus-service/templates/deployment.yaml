apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dionysus-service.fullname" . }}
  labels:
    {{- include "dionysus-service.labels" . | nindent 4 }}
spec:
  # Hardcoded, not a values field: SQLite is single-writer. See values.yaml's
  # top-of-file note and design.md Decision 1.
  replicas: 1
  # Recreate, not RollingUpdate: with a ReadWriteOnce PVC, a rolling update
  # would try to start the new pod before the old one releases the volume.
  # See design.md Decision 2.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dionysus-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dionysus-service.selectorLabels" . | nindent 8 }}
    spec:
      # The image runs as uid 1001, gid 0; fsGroup makes any mounted volume
      # group-writable for it even on StorageClasses stricter than k3s's
      # local-path (which happens to provision 0777 dirs).
      securityContext:
        fsGroup: 0
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: DIONYSUS_DB_PATH
              value: {{ .Values.env.dbPath | quote }}
            {{- if .Values.env.timezone }}
            - name: DIONYSUS_TZ
              value: {{ .Values.env.timezone | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          # Timings mirror the Dockerfile's HEALTHCHECK (interval 10s,
          # timeout 3s, start-period 20s, retries 5) — design.md Decision 4.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dionysus-service.fullname" . }}-data
